version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - MODEL_CHECKPOINT_PATH=/app/checkpoints/ChangeFormer_LEVIR/best_ckpt.pt
      - MODEL_DOWNLOAD_URL=
    volumes:
      # Mount local checkpoints folder into container so best_ckpt.pt is accessible without baking into image
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped
